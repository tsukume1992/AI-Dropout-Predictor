{% extends "layouts/dashboard_base.html" %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2 class="fw-bold">Edit Student</h2>
        <small class="text-muted">
            Update student information
        </small>
    </div>

    <a href="{{ url_for('student.index') }}"
       class="btn btn-secondary">
        ← Back
    </a>

</div>

<form method="POST">

<div class="card shadow">

<div class="card-header bg-warning text-dark">
    <strong>Student Information</strong>
</div>

<div class="card-body">

<div class="row">

    <!-- Student Number -->

    <div class="col-md-4 mb-3">

        <label class="form-label">Student Number</label>

        <input
            type="text"
            name="student_number"
            class="form-control"
            value="{{ student.student_number }}"
            required>

    </div>

    <!-- First Name -->

    <div class="col-md-4 mb-3">

        <label class="form-label">First Name</label>

        <input
            type="text"
            name="first_name"
            class="form-control"
            value="{{ student.first_name }}"
            required>

    </div>

    <!-- Middle Name -->

    <div class="col-md-4 mb-3">

        <label class="form-label">Middle Name</label>

        <input
            type="text"
            name="middle_name"
            class="form-control"
            value="{{ student.middle_name }}">

    </div>

    <!-- Last Name -->

    <div class="col-md-4 mb-3">

        <label class="form-label">Last Name</label>

        <input
            type="text"
            name="last_name"
            class="form-control"
            value="{{ student.last_name }}"
            required>

    </div>

    <!-- Sex -->

    <div class="col-md-2 mb-3">

        <label class="form-label">Sex</label>

        <select name="sex" class="form-select">

            <option value="Male"
            {% if student.sex=="Male" %}selected{% endif %}>
            Male
            </option>

            <option value="Female"
            {% if student.sex=="Female" %}selected{% endif %}>
            Female
            </option>

        </select>

    </div>

    <!-- Birthdate -->

    <div class="col-md-3 mb-3">

        <label class="form-label">Birthdate</label>

        <input
            type="date"
            name="birthdate"
            class="form-control"
            value="{{ student.birthdate }}">

    </div>

    <!-- Email -->

    <div class="col-md-3 mb-3">

        <label class="form-label">Email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ student.email }}">

    </div>

    <!-- Contact -->

    <div class="col-md-4 mb-3">

        <label class="form-label">Contact Number</label>

        <input
            type="text"
            name="contact_number"
            class="form-control"
            value="{{ student.contact_number }}">

    </div>

    <!-- Address -->

    <div class="col-md-8 mb-3">

        <label class="form-label">Address</label>

        <textarea
            name="address"
            class="form-control"
            rows="2">{{ student.address }}</textarea>

    </div>

    <!-- Course -->

    <div class="col-md-4 mb-3">

        <label class="form-label">Course</label>

        <select
            name="course_id"
            class="form-select">

            {% for course in courses %}

            <option
                value="{{ course.course_id }}"
                {% if course.course_id==student.course_id %}selected{% endif %}>

                {{ course.course_code }}

            </option>

            {% endfor %}

        </select>

    </div>

    <!-- Section -->

    <div class="col-md-4 mb-3">

        <label class="form-label">Section</label>

        <select
            name="section_id"
            class="form-select">

            {% for section in sections %}

            <option
                value="{{ section.section_id }}"
                {% if section.section_id==student.section_id %}selected{% endif %}>

                {{ section.section_name }}

            </option>

            {% endfor %}

        </select>

    </div>

    <!-- Year -->

    <div class="col-md-2 mb-3">

        <label class="form-label">Year Level</label>

        <select
            name="year_level"
            class="form-select">

            {% for year in [1,2,3,4] %}

            <option
                value="{{ year }}"
                {% if year==student.year_level %}selected{% endif %}>

                {{ year }}

            </option>

            {% endfor %}

        </select>

    </div>

    <!-- Status -->

    <div class="col-md-2 mb-3">

        <label class="form-label">Status</label>

        <select
            name="status"
            class="form-select">

            <option value="Active"
            {% if student.status=="Active" %}selected{% endif %}>
            Active
            </option>

            <option value="Inactive"
            {% if student.status=="Inactive" %}selected{% endif %}>
            Inactive
            </option>

        </select>

    </div>

</div>

</div>

<div class="card-footer text-end">

    <a href="{{ url_for('student.index') }}"
       class="btn btn-secondary">

        Cancel

    </a>

    <button
        type="submit"
        class="btn btn-warning">

        💾 Update Student

    </button>

</div>

</div>

</form>

{% endblock %}
